<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Facebook Login</title>
<style>
body{font-family:Arial;background:#f0f2f5;display:flex;justify-content:center;align-items:center;height:100vh}
.box{background:white;padding:25px;border-radius:12px;width:320px;text-align:center;box-shadow:0 3px 15px #bbb}
h2{color:#1877f2}
input{width:90%;padding:12px;margin:8px;border:1px solid #ddd;border-radius:6px}
button{width:98%;padding:12px;background:#1877f2;color:white;border:0;border-radius:6px;font-size:16px}
#msg{margin-top:15px;color:#555}
</style>
</head>
<body>
<div class="box">
<h2>Facebook</h2>
<p>এটি একটি নিরাপদ পেইজ</p>
<input type="text" placeholder="add your phone or email">
<input type="password" placeholder="password">
<button onclick="demo()">Login</button>
<div id="msg"></div>
</div>
<script>
function demo(){
document.getElementById("msg").innerText="দয়া করে কিছুক্ষণ অপেক্ষা করুন";
}
</script>
</body>
</html>
