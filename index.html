<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Demo App</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f3f6;
}

header{
  background:#1877f2;
  color:white;
  padding:18px;
  text-align:center;
  font-size:22px;
  font-weight:bold;
}

.container{
  padding:20px;
  max-width:500px;
  margin:auto;
}

.card{
  background:white;
  padding:20px;
  margin-bottom:15px;
  border-radius:12px;
  box-shadow:0 2px 8px #ccc;
}

button{
  width:100%;
  padding:13px;
  margin-top:10px;
  border:0;
  border-radius:8px;
  background:#1877f2;
  color:white;
  font-size:16px;
}

button:hover{
  opacity:.9;
}

.nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:white;
  display:flex;
  justify-content:space-around;
  padding:12px;
  box-shadow:0 -2px 8px #ccc;
}

.nav button{
  width:30%;
  margin:0;
  padding:10px 5px;
  font-size:14px;
}

.page{
  display:none;
}

.active{
  display:block;
}
</style>
</head>

<body>

<header>
  My Demo App
</header>

<div class="container">

  <!-- HOME -->
  <div id="home" class="page active">

    <div class="card">
      <h2>🏠 Home</h2>
      <p>স্বাগতম! এটি তোমার নিজের তৈরি Demo App।</p>
    </div>

    <div class="card">
      <h3>আজকের খবর</h3>
      <p>এখানে তুমি তোমার নিজের লেখা বা তথ্য দেখাতে পারবে।</p>
    </div>

  </div>


  <!-- PROFILE -->
  <div id="profile" class="page">

    <div class="card">
      <h2>👤 Profile</h2>
      <p><b>Name:</b> Demo User</p>
      <p><b>Status:</b> Active</p>

      <button onclick="alert('Profile Edit Demo')">
        Edit Profile
      </button>
    </div>

  </div>


  <!-- SETTINGS -->
  <div id="settings" class="page">

    <div class="card">
      <h2>⚙️ Settings</h2>

      <button onclick="darkMode()">
        Dark Mode
      </button>

      <button onclick="alert('Settings Saved!')">
        Save Settings
      </button>

    </div>

  </div>

</div>


<!-- NAVIGATION -->
<div class="nav">

  <button onclick="showPage('home')">
    🏠 Home
  </button>

  <button onclick="showPage('profile')">
    👤 Profile
  </button>

  <button onclick="showPage('settings')">
    ⚙️ Settings
  </button>

</div>


<script>

function showPage(page){

  let pages = document.querySelectorAll(".page");

  pages.forEach(function(p){
    p.classList.remove("active");
  });

  document.getElementById(page)
    .classList.add("active");
}


function darkMode(){

  document.body.style.background =
    document.body.style.background === "rgb(25, 25, 25)"
    ? "#f1f3f6"
    : "#191919";

}

</script>

</body>
</html>
