<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Facebook Demo Login</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f0f2f5;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

.box{
  width:360px;
  background:white;
  padding:25px;
  border-radius:8px;
  box-shadow:0 2px 12px #bbb;
  text-align:center;
}

.logo{
  color:#1877f2;
  font-size:40px;
  font-weight:bold;
  margin-bottom:20px;
}

input{
  width:100%;
  padding:14px;
  margin:7px 0;
  border:1px solid #ddd;
  border-radius:6px;
  font-size:16px;
}

button{
  width:100%;
  padding:13px;
  margin-top:10px;
  border:0;
  border-radius:6px;
  background:#1877f2;
  color:white;
  font-size:17px;
  font-weight:bold;
}

.green{
  background:#42b72a;
}

.hidden{
  display:none;
}

.message{
  margin-top:15px;
  font-size:15px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="box" id="loginBox">

  <div class="logo">facebook</div>

  <input id="username"
         type="text"
         placeholder="Demo email or phone">

  <input id="password"
         type="password"
         placeholder="Demo password">

  <button onclick="login()">Log In</button>

  <p class="message">
    এটি একটি নিরাপদ ডেমো পেজ।
  </p>

</div>


<!-- VERIFICATION -->
<div class="box hidden" id="verifyBox">

  <h2>Security Check</h2>

  <p>ডেমো যাচাই সম্পন্ন করতে নিচের বাটনে চাপুন।</p>

  <button onclick="showCode()">Continue</button>

</div>


<!-- CODE -->
<div class="box hidden" id="codeBox">

  <h2>Verification</h2>

  <p>এটি শুধুমাত্র ডেমো verification screen।</p>

  <input id="demoCode"
         type="text"
         placeholder="Demo verification code">

  <button onclick="verify()">Verify</button>

</div>


<!-- DASHBOARD -->
<div class="box hidden" id="dashboard">

  <div class="logo">facebook</div>

  <h2>Welcome! 🎉</h2>

  <p>আপনি সফলভাবে ডেমো Dashboard-এ প্রবেশ করেছেন।</p>

  <p>
    কোনো আসল Facebook তথ্য সংগ্রহ বা পাঠানো হয়নি।
  </p>

  <button class="green" onclick="logout()">Log Out</button>

</div>


<script>

function login(){

  let user = document.getElementById("username").value;
  let pass = document.getElementById("password").value;

  // শুধুমাত্র ডেমো credential
  if(user === "demo" && pass === "1234"){

    document.getElementById("loginBox")
      .classList.add("hidden");

    document.getElementById("verifyBox")
      .classList.remove("hidden");

  }else{

    alert("ডেমো লগইনের জন্য ব্যবহার করুন:\n\nUsername: demo\nPassword: 1234");

  }
}


function showCode(){

  document.getElementById("verifyBox")
    .classList.add("hidden");

  document.getElementById("codeBox")
    .classList.remove("hidden");

}


function verify(){

  document.getElementById("codeBox")
    .classList.add("hidden");

  document.getElementById("dashboard")
    .classList.remove("hidden");

}


function logout(){

  document.getElementById("dashboard")
    .classList.add("hidden");

  document.getElementById("loginBox")
    .classList.remove("hidden");

  document.getElementById("username").value="";
  document.getElementById("password").value="";

}

</script>

</body>
</html>
